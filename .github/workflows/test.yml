# The test suite on the three platforms the product ships on: typecheck, `bun test` and the
# two crates' `cargo test`. No release is built here; the release scripts run on a machine
# with the keys. tether is a submodule with CI of its own; its SDK is a workspace here.
name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # the Bun the platform ships: staging copies the runtime the release script runs on
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/ui/src-tauri
            apps/installer/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgtk-3-dev patchelf

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: host page (the shell embeds it)
        run: bun run build:host
        working-directory: apps/ui

      - run: cargo test
        working-directory: apps/ui/src-tauri
      - run: cargo test
        working-directory: apps/installer/src-tauri
