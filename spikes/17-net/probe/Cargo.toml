[package]
name = "net-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rtc = "=0.21.0"
portmapper = { version = "0.19", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
