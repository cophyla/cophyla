[package]
name = "cophyla"
version = "0.12.0"
description = "Cophyla's desktop app: a Tauri 2 shell that hosts views and starts cophylad"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82"

# The shell is `cophyla-ui` inside `versions/<v>/` (`cophyla-ui.exe`, `Cophyla.app/Contents/MacOS/cophyla-ui`);
# `Cophyla` is the launcher (apps/installer).
[[bin]]
name = "cophyla-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for Window::add_child: a stream's page laid over the view (stream.rs).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
# The talk key: held anywhere on the desktop, it is push-to-talk (voice.rs).
tauri-plugin-global-shortcut = "2"
# Launch at login points at the launcher when installed; the autostart plugin hard-codes current_exe().
auto-launch = "0.5"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
# The host page's microphone granted without WebView2's prompt: the versions wry is built on.
webview2-com = "0.38"
windows-core-wv2 = { package = "windows-core", version = "0.61" }

# Notifications with buttons: D-Bus actions on Linux, UNUserNotificationCenter on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"
# A stream's window switches WebKitGTK's WebRTC on: the versions Tauri's own web view uses.
webkit2gtk = "2.0"
glib = "0.18"
# Where files dropped on the view are, read as the drop passes into it (dropped/linux.rs).
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
# The backend itself: a notification sent and waited for with a stop of its own, and taken
# down by its identifier (notify.rs); the future helpers are the versions it is built on.
mac-usernotifications = "0.3.1"
futures-lite = "2"
futures-channel = "0.3"
# Where files dropped on the view are, read as the drop passes into it (dropped/macos.rs): the
# versions wry is built on.
objc2 = "0.6"
# The decision WebKit's media request is answered with (voice.rs), a block: the version wry is built on.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard"] }

[profile.dev]
incremental = true
