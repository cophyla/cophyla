[package]
name = "cophyla-launcher"
version = "0.13.0"
description = "Cophyla: the fixed entry point of an installed Cophyla; starts the current version of the desktop app and rotates staged releases"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "cophyla-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-winres = "0.3"

[dependencies]
# The Tauri CLI builds every app with `--features tauri/custom-protocol`, so the crate must
# depend on tauri to be bundled; the launcher uses nothing of it (probe P1 in the README).
tauri = { version = "2", default-features = false, features = [] }
# The user's data directory: the root on macOS and Linux.
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)` for `--wait-pid`.
libc = "0.2"

[profile.release]
opt-level = "s"
strip = true
